services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  salesbot:
    image: ${SALESBOT_IMAGE:-salesbot:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./production.env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      SALESBOT_REQUIRE_PRODUCTION_READY: "true"
      SALESBOT_DB_WAIT_TIMEOUT: 120
      VPS_SSO_IFRAME_COOKIE: ${VPS_SSO_IFRAME_COOKIE:-true}
      PDCA_SSO_ENABLED: ${PDCA_SSO_ENABLED:-true}
      PDCA_SSO_EXCHANGE_URL: ${PDCA_SSO_EXCHANGE_URL:-https://pdca-workbench-teams.vertu.cn/api/auth/acquisition/exchange}
      PDCA_EMBED_ALLOWED_ORIGINS: ${PDCA_EMBED_ALLOWED_ORIGINS:-https://pdca-workbench-teams.vertu.cn}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8765"

  mailbox-worker:
    image: ${SALESBOT_IMAGE:-salesbot:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./production.env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      SALESBOT_REQUIRE_PRODUCTION_READY: "true"
      SALESBOT_DB_WAIT_TIMEOUT: 120
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/salesbot-worker-success -mmin -3 -print -quit | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m
    command: >
      sh -ec 'while true; do
        salesbot mailbox-poll --config config.yaml --limit 200;
        touch /tmp/salesbot-worker-success;
        sleep "$${MAILBOX_POLL_INTERVAL_SECONDS:-60}";
      done'

  scheduler-worker:
    image: ${SALESBOT_IMAGE:-salesbot:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./production.env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      SALESBOT_REQUIRE_PRODUCTION_READY: "true"
      SALESBOT_DB_WAIT_TIMEOUT: 120
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/salesbot-worker-success -mmin -15 -print -quit | grep -q ."]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 5m
    command: >
      sh -ec 'while true; do
        salesbot scheduler --config config.yaml
          --enrich-limit "$${SALESBOT_SCHEDULER_ENRICH_LIMIT:-100}"
          --queue-limit "$${SALESBOT_SCHEDULER_QUEUE_LIMIT:-100}"
          --send-limit "$${SALESBOT_SCHEDULER_SEND_LIMIT:-0}";
        touch /tmp/salesbot-worker-success;
        sleep "$${SALESBOT_SCHEDULER_INTERVAL_SECONDS:-300}";
      done'

  contactout-bridge:
    profiles: ["contactout"]
    build:
      context: ../contactout_bridge
      dockerfile: Dockerfile
    image: ${CONTACTOUT_BRIDGE_IMAGE:-salesbot-contactout-bridge:local}
    restart: unless-stopped
    env_file:
      - path: ./production.env
        required: false
    environment:
      CONTACTOUT_CREDENTIALS_FILE: /run/secrets/contactout-accounts.json
      CONTACTOUT_BRIDGE_DB: /data/idempotency.sqlite3
      CONTACTOUT_SESSION_DIR: /data/sessions
      CONTACTOUT_BROWSER_HEADLESS: "false"
    expose:
      - "8790"
    volumes:
      - ${CONTACTOUT_CREDENTIALS_FILE_HOST:-./secrets/contactout-accounts.json}:/run/secrets/contactout-accounts.json:ro
      - contactout_bridge_data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - salesbot
    environment:
      SALES_DOMAIN: ${SALES_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  postgres-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: ./production.env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "find /backups/.last_success -mmin -1500 -print -quit | grep -q ."]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 5m
    command: >
      sh -ec 'while true; do
        export PGPASSWORD="$${DB_PASSWORD}";
        backup_tmp="/backups/salesbot_$$(date +%F_%H%M%S).dump.tmp";
        backup_final="$${backup_tmp%.tmp}";
        rm -f "$${backup_tmp}";
        if pg_dump -Fc -h "$${DB_HOST}" -p "$${DB_PORT}" -U "$${DB_USER}" -f "$${backup_tmp}" "$${DB_NAME}" && test -s "$${backup_tmp}"; then
          mv "$${backup_tmp}" "$${backup_final}";
          touch /backups/.last_success;
        else
          rm -f "$${backup_tmp}";
          exit 1;
        fi;
        find /backups -name "salesbot_*.dump" -mtime +7 -delete;
        find /backups -name "salesbot_*.sql.gz" -mtime +7 -delete;
        sleep 86400;
      done'

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  contactout_bridge_data:
