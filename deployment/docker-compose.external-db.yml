services:
  salesbot:
    image: ${SALESBOT_IMAGE:-salesbot:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./production.env
        required: false
    environment:
      SALESBOT_REQUIRE_PRODUCTION_READY: "true"
      SALESBOT_DB_WAIT_TIMEOUT: 120
      VPS_SSO_IFRAME_COOKIE: ${VPS_SSO_IFRAME_COOKIE:-true}
      PDCA_SSO_ENABLED: ${PDCA_SSO_ENABLED:-true}
      PDCA_SSO_EXCHANGE_URL: ${PDCA_SSO_EXCHANGE_URL:-https://pdca-workbench-teams.vertu.cn/api/auth/acquisition/exchange}
      PDCA_EMBED_ALLOWED_ORIGINS: ${PDCA_EMBED_ALLOWED_ORIGINS:-https://pdca-workbench-teams.vertu.cn}
    expose:
      - "8765"

  mailbox-worker:
    image: ${SALESBOT_IMAGE:-salesbot:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./production.env
        required: false
    environment:
      SALESBOT_REQUIRE_PRODUCTION_READY: "true"
      SALESBOT_DB_WAIT_TIMEOUT: 120
    healthcheck:
      disable: true
    command: >
      sh -c 'while true; do
        salesbot mailbox-poll --config config.yaml --limit 200 || true;
        sleep "$${MAILBOX_POLL_INTERVAL_SECONDS:-60}";
      done'

  acquisition-worker:
    image: ${SALESBOT_IMAGE:-salesbot:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./production.env
        required: false
    environment:
      SALESBOT_REQUIRE_PRODUCTION_READY: "true"
      SALESBOT_DB_WAIT_TIMEOUT: 120
    healthcheck:
      disable: true
    command: >
      sh -c 'while true; do
        salesbot acquisition-run --config config.yaml --limit 10 || true;
        sleep "$${ACQUISITION_POLL_INTERVAL_SECONDS:-900}";
      done'

  contactout-worker:
    image: ${SALESBOT_IMAGE:-salesbot:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./production.env
        required: false
    environment:
      SALESBOT_REQUIRE_PRODUCTION_READY: "true"
      SALESBOT_DB_WAIT_TIMEOUT: 120
    healthcheck:
      disable: true
    command: >
      sh -c 'while true; do
        salesbot contactout-run --config config.yaml --limit 10 || true;
        sleep "$${CONTACTOUT_POLL_INTERVAL_SECONDS:-60}";
      done'

  contactout-bridge:
    profiles: ["contactout"]
    build:
      context: ../contactout_bridge
      dockerfile: Dockerfile
    image: ${CONTACTOUT_BRIDGE_IMAGE:-salesbot-contactout-bridge:local}
    restart: unless-stopped
    env_file:
      - path: ./production.env
        required: false
    environment:
      CONTACTOUT_CREDENTIALS_FILE: /run/secrets/contactout-accounts.json
      CONTACTOUT_BRIDGE_DB: /data/idempotency.sqlite3
      CONTACTOUT_SESSION_DIR: /data/sessions
      CONTACTOUT_BROWSER_HEADLESS: "false"
    expose:
      - "8790"
    volumes:
      - ${CONTACTOUT_CREDENTIALS_FILE_HOST:-./secrets/contactout-accounts.json}:/run/secrets/contactout-accounts.json:ro
      - contactout_bridge_data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - salesbot
    environment:
      SALES_DOMAIN: ${SALES_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  contactout_bridge_data:
